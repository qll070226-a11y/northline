name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/northline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp,research,langgraph]"
      - run: python -m pytest -q
      - run: python experiments/generate_tasks.py
      - run: python experiments/synthetic_faults.py
      - run: python experiments/smoke.py
      - run: python experiments/analysis.py results/smoke.jsonl --baseline flat_multi_agent --treatment full_protocol
