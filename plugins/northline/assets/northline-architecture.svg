<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1960" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc">
  <title id="title">Northline detailed system architecture</title>
  <desc id="desc">Detailed journal-style architecture of Northline: control plane, bounded delegation, isolated workspaces, evidence reconstruction, verification gates, parent review, root-only integration and research event storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66727d"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356f91"/>
    </marker>
    <style>
      .figure-title { font: 700 30px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; letter-spacing:0; fill:#17212b; }
      .figure-subtitle { font: 400 16px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#59636d; }
      .section { font: 700 13px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; letter-spacing:1.8px; fill:#46515c; }
      .node-title { font: 600 20px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#1f2b35; }
      .node-title-sm { font: 600 17px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#1f2b35; }
      .node-body { font: 400 15.5px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#4c5862; }
      .node-note { font: 400 13.5px 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#66727d; }
      .panel { fill:#fbfcfd; stroke:#b8c1c9; stroke-width:1.4; }
      .line { fill:none; stroke:#66727d; stroke-width:1.8; marker-end:url(#arrow); }
      .accent-line { fill:none; stroke:#356f91; stroke-width:2.1; marker-end:url(#arrowAccent); }
      .dashed { fill:none; stroke:#89949d; stroke-width:1.6; stroke-dasharray:6 6; marker-end:url(#arrow); }
      .node { stroke-width:1.5; }
    </style>
  </defs>

  <rect width="1800" height="1960" fill="#ffffff"/>
  <text x="90" y="62" class="figure-title">Northline: verifiable delegation control plane</text>
  <text x="90" y="92" class="figure-subtitle">Mission state, bounded delegation, evidence gates and Root-controlled integration for long-horizon software work</text>
  <path d="M90 116 H1710" stroke="#c9d0d6" stroke-width="1.2"/>

  <rect x="730" y="145" width="340" height="68" rx="5" fill="#e5eef4" stroke="#47728b" class="node"/>
  <text x="900" y="187" text-anchor="middle" class="node-title">用户 / User</text>
  <path d="M900 213 V250" class="accent-line"/>

  <rect x="600" y="250" width="600" height="100" rx="5" fill="#dceaf2" stroke="#47728b" class="node"/>
  <text x="900" y="293" text-anchor="middle" class="node-title">Root Agent</text>
  <text x="900" y="324" text-anchor="middle" class="node-body">理解目标 · 保留最终决策与集成权</text>
  <path d="M900 350 V390" class="accent-line"/>

  <rect x="490" y="390" width="820" height="94" rx="5" fill="#d2e3ed" stroke="#47728b" stroke-width="1.8"/>
  <text x="900" y="430" text-anchor="middle" class="node-title">Northline Control Plane</text>
  <text x="900" y="460" text-anchor="middle" class="node-body">持久化主线 · 委派治理 · 证据重建 · 集成门禁</text>

  <rect x="70" y="530" width="1660" height="235" class="panel"/>
  <text x="105" y="565" class="section">MISSION &amp; GOVERNANCE</text>
  <rect x="110" y="600" width="450" height="120" rx="4" fill="#edf3f6" stroke="#6e96aa" class="node"/>
  <text x="335" y="644" text-anchor="middle" class="node-title">MissionState</text>
  <text x="335" y="676" text-anchor="middle" class="node-body">根目标 · 全局约束 · 决策</text>
  <text x="335" y="700" text-anchor="middle" class="node-note">最终验收标准 · root commit</text>
  <rect x="675" y="600" width="450" height="120" rx="4" fill="#f0eef5" stroke="#887e9f" class="node"/>
  <text x="900" y="644" text-anchor="middle" class="node-title">Delegation Engine</text>
  <text x="900" y="676" text-anchor="middle" class="node-body">契约版本 · 权限边界 · 依赖</text>
  <text x="900" y="700" text-anchor="middle" class="node-note">递归深度与子任务数量限制</text>
  <rect x="1240" y="600" width="450" height="120" rx="4" fill="#edf3f6" stroke="#6e96aa" class="node"/>
  <text x="1465" y="644" text-anchor="middle" class="node-title">State Machine</text>
  <text x="1465" y="676" text-anchor="middle" class="node-body">PLANNED → CLAIMED → EXECUTING</text>
  <text x="1465" y="700" text-anchor="middle" class="node-note">REPORTING → VERIFIED → INTEGRATED</text>
  <path d="M900 484 V555 H335 V600" class="line"/>
  <path d="M900 484 V600" class="line"/>
  <path d="M900 484 V555 H1465 V600" class="line"/>

  <rect x="70" y="810" width="520" height="410" class="panel"/>
  <text x="105" y="845" class="section">RUNTIME ADAPTERS</text>
  <rect x="110" y="885" width="440" height="92" rx="4" fill="#f0eef5" stroke="#887e9f" class="node"/>
  <text x="330" y="924" text-anchor="middle" class="node-title">Agent Runtime Adapter</text>
  <text x="330" y="952" text-anchor="middle" class="node-note">显式授权 · JSONL · thread · usage</text>
  <rect x="110" y="1010" width="125" height="104" rx="4" fill="#ffffff" stroke="#aaa1ba" class="node"/>
  <text x="172" y="1052" text-anchor="middle" class="node-title-sm">Codex</text>
  <text x="172" y="1080" text-anchor="middle" class="node-note">当前适配</text>
  <rect x="260" y="1010" width="125" height="104" rx="4" fill="#ffffff" stroke="#aaa1ba" class="node"/>
  <text x="322" y="1052" text-anchor="middle" class="node-title-sm">OpenHands</text>
  <text x="322" y="1080" text-anchor="middle" class="node-note">未来适配</text>
  <rect x="410" y="1010" width="125" height="104" rx="4" fill="#ffffff" stroke="#aaa1ba" class="node"/>
  <text x="472" y="1052" text-anchor="middle" class="node-title-sm">SWE-agent</text>
  <text x="472" y="1080" text-anchor="middle" class="node-note">研究对照</text>
  <path d="M330 977 V1010" class="line"/>

  <rect x="640" y="810" width="520" height="410" class="panel"/>
  <text x="675" y="845" class="section">ISOLATED WORKSPACES</text>
  <rect x="680" y="885" width="440" height="92" rx="4" fill="#edf3f6" stroke="#6e96aa" class="node"/>
  <text x="900" y="924" text-anchor="middle" class="node-title">Workspace Manager</text>
  <text x="900" y="952" text-anchor="middle" class="node-note">固定基线 · 干净状态 · 独立 worktree</text>
  <rect x="680" y="1010" width="200" height="130" rx="4" fill="#ffffff" stroke="#6e96aa" class="node"/>
  <text x="780" y="1050" text-anchor="middle" class="node-title-sm">Worker Worktree</text>
  <text x="780" y="1080" text-anchor="middle" class="node-note">固定 base_commit</text>
  <text x="780" y="1105" text-anchor="middle" class="node-note">父任务隔离分支</text>
  <rect x="900" y="1010" width="200" height="130" rx="4" fill="#ffffff" stroke="#6e96aa" class="node"/>
  <text x="1000" y="1050" text-anchor="middle" class="node-title-sm">Leaf Worktree</text>
  <text x="1000" y="1080" text-anchor="middle" class="node-note">独立分支</text>
  <text x="1000" y="1105" text-anchor="middle" class="node-note">有界变更</text>
  <path d="M900 977 V1010" class="line"/>

  <rect x="1210" y="810" width="520" height="410" class="panel"/>
  <text x="1245" y="845" class="section">BOUNDED DELEGATION TREE</text>
  <rect x="1270" y="885" width="400" height="82" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="1470" y="922" text-anchor="middle" class="node-title">Root</text>
  <text x="1470" y="949" text-anchor="middle" class="node-note">理解主线 · 最终决策</text>
  <rect x="1270" y="995" width="400" height="82" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="1470" y="1032" text-anchor="middle" class="node-title">Worker</text>
  <text x="1470" y="1059" text-anchor="middle" class="node-note">持有契约 · 获授权后派生</text>
  <rect x="1270" y="1105" width="400" height="82" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="1470" y="1142" text-anchor="middle" class="node-title">Leaf</text>
  <text x="1470" y="1169" text-anchor="middle" class="node-note">单一有界契约 · 不得继续派生</text>
  <path d="M1470 967 V995" class="accent-line"/>
  <path d="M1470 1077 V1105" class="accent-line"/>
  <path d="M900 720 V790 H330 V885" class="line"/>
  <path d="M900 720 V885" class="line"/>
  <path d="M900 720 V790 H1470 V885" class="line"/>

  <rect x="70" y="1270" width="1660" height="310" class="panel"/>
  <text x="105" y="1305" class="section">HANDOFF &amp; EVIDENCE</text>
  <rect x="110" y="1350" width="360" height="140" rx="4" fill="#f6f1e5" stroke="#9b8751" class="node"/>
  <text x="290" y="1392" text-anchor="middle" class="node-title">Git Evidence</text>
  <text x="290" y="1424" text-anchor="middle" class="node-body">真实 commit · diff</text>
  <text x="290" y="1454" text-anchor="middle" class="node-note">文件范围 · 祖先关系</text>
  <rect x="520" y="1350" width="360" height="140" rx="4" fill="#f6f1e5" stroke="#9b8751" class="node"/>
  <text x="700" y="1392" text-anchor="middle" class="node-title">Test Evidence</text>
  <text x="700" y="1424" text-anchor="middle" class="node-body">重新运行要求的测试</text>
  <text x="700" y="1454" text-anchor="middle" class="node-note">命令 · 输出 · 超时</text>
  <rect x="930" y="1350" width="360" height="140" rx="4" fill="#f6f1e5" stroke="#9b8751" class="node"/>
  <text x="1110" y="1392" text-anchor="middle" class="node-title">Protocol Evidence</text>
  <text x="1110" y="1424" text-anchor="middle" class="node-body">身份 · 版本 · 状态 · 依赖</text>
  <text x="1110" y="1454" text-anchor="middle" class="node-note">契约与交接一致性</text>
  <rect x="1340" y="1350" width="350" height="140" rx="4" fill="#edf3f6" stroke="#6e96aa" class="node"/>
  <text x="1515" y="1392" text-anchor="middle" class="node-title">Handoff Receipt</text>
  <text x="1515" y="1424" text-anchor="middle" class="node-body">结果 commit · 变更文件</text>
  <text x="1515" y="1454" text-anchor="middle" class="node-note">测试 · 假设 · 风险 · 未决问题</text>
  <path d="M780 1140 V1280 H1515 V1350" class="line"/>
  <path d="M1000 1140 V1260 H1515 V1350" class="line"/>
  <path d="M290 1490 V1520 H820 V1580" class="line"/>
  <path d="M700 1490 V1580" class="line"/>
  <path d="M1110 1490 V1520 H820 V1580" class="line"/>
  <path d="M1515 1490 V1580 H980" class="line"/>

  <rect x="640" y="1605" width="520" height="112" rx="4" fill="#f0eef5" stroke="#887e9f" class="node"/>
  <text x="900" y="1650" text-anchor="middle" class="node-title">Deterministic Verification Engine</text>
  <text x="900" y="1682" text-anchor="middle" class="node-note">范围 · commit 新鲜度 · 契约版本 · 测试 · 根约束</text>
  <path d="M900 1717 V1750" class="line"/>

  <rect x="70" y="1630" width="440" height="108" rx="4" fill="#f5e9e7" stroke="#9d6259" class="node"/>
  <text x="290" y="1674" text-anchor="middle" class="node-title">拒绝 / 升级 / 重订契约</text>
  <text x="290" y="1706" text-anchor="middle" class="node-note">REJECTED · STALE · BLOCKED</text>
  <path d="M640 1660 H510" class="dashed"/>

  <rect x="1270" y="1630" width="460" height="108" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="1500" y="1674" text-anchor="middle" class="node-title">Parent Review</text>
  <text x="1500" y="1706" text-anchor="middle" class="node-note">验证通过后由 Root 审查剩余风险</text>
  <path d="M1160 1660 H1270" class="accent-line"/>

  <rect x="720" y="1760" width="360" height="82" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="900" y="1797" text-anchor="middle" class="node-title">Root-only Integrator</text>
  <text x="900" y="1824" text-anchor="middle" class="node-note">唯一允许集成结果的人</text>
  <path d="M1500 1738 V1800 H1080" class="accent-line"/>
  <path d="M900 1842 V1870" class="accent-line"/>

  <rect x="720" y="1880" width="360" height="82" rx="4" fill="#e9f1eb" stroke="#6f9077" class="node"/>
  <text x="900" y="1917" text-anchor="middle" class="node-title-sm">Global Tests &amp; Goal Acceptance</text>
  <text x="900" y="1944" text-anchor="middle" class="node-note">通过后记录 INTEGRATED</text>

  <rect x="1270" y="1760" width="460" height="142" rx="4" fill="#f1f3f5" stroke="#88939c" class="node"/>
  <text x="1500" y="1803" text-anchor="middle" class="node-title">Research Harness</text>
  <text x="1500" y="1834" text-anchor="middle" class="node-body">只观察事件与结果，不授权集成</text>
  <text x="1500" y="1864" text-anchor="middle" class="node-note">metrics · failure cases · cost/latency</text>
  <path d="M1500 1738 V1760" class="dashed"/>

  <rect x="120" y="1840" width="420" height="98" rx="4" fill="#edf3f6" stroke="#6e96aa" class="node"/>
  <text x="330" y="1881" text-anchor="middle" class="node-title">Event Store</text>
  <text x="330" y="1912" text-anchor="middle" class="node-note">JSONL 时间线 · 状态恢复 · 审计</text>
  <path d="M720 1920 H540" class="line"/>
  <path d="M1270 1880 H540" class="dashed"/>
  <text x="90" y="1950" class="node-note">Northline 0.9.3 · deterministic evidence gates · bounded Root / Worker / Leaf delegation</text>
</svg>
